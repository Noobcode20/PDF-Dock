name: PDF Dock beta release

on:
  push:
    tags:
      - 'v0.1.0-beta.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }} installer
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-latest
            script: package:mac
          - platform: Windows
            runner: windows-latest
            script: package:win
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-installer
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/beta*.yml
            release/latest*.yml
          if-no-files-found: error

  publish:
    name: Publish beta downloads
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find release -maxdepth 1 -type f -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No installer or updater metadata files were downloaded."
            exit 1
          fi
          test -f release/beta.yml
          test -f release/beta-mac.yml
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "PDF Dock $GITHUB_REF_NAME" \
              --prerelease \
              --notes "PDF Dock beta for macOS and Windows. Please report issues in the repository."
          fi
